<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1A4D29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PG Chat">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="robots" content="noindex,nofollow">
<title>PG del Campo — Panel de Chat</title>
<style>
  :root{ --verde:#1A4D29; --verde2:#2E683C; --dorado:#E3B505; --bg:#f4f2ec; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#222}
  header{background:var(--verde);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .dot{color:var(--dorado)}
  header input{padding:7px 9px;border:0;border-radius:6px;font-size:13px}
  header input#inKey{width:130px}
  header input#inUrl{width:270px}
  header button{background:var(--dorado);color:#3a2e00;border:0;padding:7px 12px;border-radius:6px;font-weight:700;cursor:pointer}
  .barra{background:#fff8e1;border-bottom:1px solid #f0e0a0;padding:7px 18px;font-size:12px;color:#6b5900;display:none}
  .barra b{color:#8a6b00}
  .wrap{display:flex;height:calc(100vh - 52px)}
  .lista{width:300px;border-right:1px solid #ddd;overflow-y:auto;background:#fff}
  .sItem{padding:11px 14px;border-bottom:1px solid #eee;cursor:pointer}
  .sItem:hover{background:#f7f5ef}
  .sItem.sel{background:#eef5ee;border-left:4px solid var(--verde)}
  .sItem .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .sItem .nom{font-weight:700;font-size:14px;color:var(--verde)}
  .sItem .sub{font-size:12px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{background:#d33;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
  .warn{background:#fde2e1;color:#8a1c17;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
  .tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700}
  .tag.bot{background:#e7eef7;color:#2a5a8c}
  .tag.humano{background:#fdebc7;color:#8a6b00}
  .chat{flex:1;display:flex;flex-direction:column}
  .chatHead{padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .chatHead .modoBtn{border:0;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}
  .modoBtn.tomar{background:var(--verde);color:#fff}
  .modoBtn.soltar{background:#ccc;color:#333}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .m{max-width:72%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
  .m.cliente{align-self:flex-start;background:#fff;border:1px solid #e3e0d7}
  .m.bot{align-self:flex-end;background:#e7eef7}
  .m.humano{align-self:flex-end;background:var(--verde);color:#fff}
  .m.nota{align-self:center;background:transparent;border:1px dashed #c9c3b3;color:#7a7263;font-size:12px;padding:6px 10px;max-width:80%;text-align:center}
  .m .meta{display:block;font-size:10px;opacity:.6;margin-top:3px}
  .input{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #ddd}
  .input input{flex:1;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
  .input button{background:var(--verde);color:#fff;border:0;padding:0 18px;border-radius:8px;font-weight:700;cursor:pointer}
  .vacio{margin:auto;color:#999;text-align:center;padding:30px;line-height:1.5}
  #btnVolver{display:none;background:none;border:0;font-size:26px;line-height:1;color:var(--verde);padding:0 10px 0 0;cursor:pointer}
  /* ---------- CELULAR: lista y chat a pantalla completa ---------- */
  @media (max-width: 820px){
    body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
    header{padding:10px 12px;gap:8px}
    header h1{font-size:15px;width:100%;margin-bottom:2px}
    header input#inUrl{width:100%;font-size:12px;padding:8px}
    header input#inKey{width:calc(100% - 108px);padding:8px}
    header button{padding:8px 14px}
    .barra{font-size:11px;padding:6px 12px}
    .wrap{flex:1 1 auto;height:auto;min-height:0;display:block;position:relative}
    .lista{width:100%;height:100%;border-right:0}
    .chat{display:none;height:100%}
    body.chatAbierto .lista{display:none}
    body.chatAbierto .chat{display:flex}
    #btnVolver{display:inline-block}
    .chatHead{padding:8px 10px}
    .msgs{padding:10px}
    .m{max-width:86%;font-size:14px}
    .input{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<header>
  <h1>☕ PG del Campo <span class="dot">— Chat en Vivo</span></h1>
  <input id="inUrl" placeholder="URL del bot (https://...onrender.com)">
  <input id="inKey" type="password" placeholder="Clave admin">
  <button id="btnConn">Conectar</button>
  <span id="estado" style="font-size:12px;opacity:.85"></span>
</header>
<div class="barra" id="barra"></div>
<div class="wrap">
  <div class="lista" id="lista"><div class="vacio">Conectá arriba para ver las conversaciones.</div></div>
  <div class="chat">
    <div class="chatHead" id="chatHead" style="display:none">
      <div style="display:flex;align-items:center;min-width:0"><button id="btnVolver" title="Volver a la lista">‹</button><b id="chatNom">—</b> <span id="chatModo" class="tag bot">bot</span> <span id="chatAlerta" class="warn" style="display:none"></span></div>
      <button id="btnModo" class="modoBtn tomar">Tomar conversación</button>
    </div>
    <div class="msgs" id="msgs"><div class="vacio">Elegí una conversación de la izquierda.</div></div>
    <div class="input" id="inputRow" style="display:none">
      <input id="txt" placeholder="Escribí tu respuesta…" autocomplete="off">
      <button id="btnEnviar">Enviar</button>
    </div>
  </div>
</div>
<script id="panelScript">
(function(){
  var $=function(id){return document.getElementById(id);};
  var DEF='https://pg-del-campo-agente.onrender.com'; /* URL REAL del bot en Render */
  var AGENT=DEF, KEY='', SEL=null, modoSel='bot', lastTs=0, tSes=null, tMsg=null;
  var SESMETA={}, BUILD='';

  var totalNoLeidos=0;
  function api(path){ return AGENT.replace(/\/$/,'') + path + (path.indexOf('?')>-1?'&':'?') + 'key=' + encodeURIComponent(KEY); }
  function hhmm(ts){ try{ var d=new Date(ts); return d.toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function setEstado(t){ $('estado').textContent=t||''; }

  // Acepta "pg-del-campo-bot.onrender.com" y lo deja en https://...
  function normalizar(u){
    u=String(u||'').trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    return u.replace(/\/+$/,'');
  }

  function mostrarBarra(txt){
    var b=$('barra');
    if(!txt){ b.style.display='none'; b.innerHTML=''; return; }
    b.style.display='block'; b.innerHTML=txt;
  }

  async function cargarSalud(){
    try{
      var r=await fetch(api('/salud')); if(!r.ok) return;
      var d=await r.json();
      BUILD=d.build||'';
      var avisos=[];
      if(d.whatsappToken===false || d.whatsappPhoneId===false){
        avisos.push('⚠ El aviso por WhatsApp al dueño NO está activo (falta WHATSAPP_TOKEN o WHATSAPP_PHONE_NUMBER_ID). El bot no va a decir que avisó, pero a vos no te va a llegar el pitazo.');
      }
      if(d.adminKeyConfigurada===false){
        avisos.push('⚠ La clave es la de fábrica (pg-admin). Cualquiera que la sepa puede leer los chats. Poné ADMIN_KEY en Render con una clave tuya.');
      }
      if(BUILD) avisos.push('Versión del bot en línea: <b>'+BUILD+'</b>');
      mostrarBarra(avisos.length? avisos.join('<br>') : '');
    }catch(e){}
  }

  async function cargarSesiones(){
    try{
      var r=await fetch(api('/chat-sessions'));
      if(r.status===401){ setEstado('⚠ clave incorrecta'); mostrarBarra('La <b>clave no coincide</b>. Ese bot ya tiene una clave propia configurada en Render (la de fábrica <b>pg-admin</b> NO sirve). Escribí la clave que pusiste en Render → tu servicio → pestaña <b>Environment</b> → <b>ADMIN_KEY</b>. Si no la recordás, cambiala ahí: Environment → Edit → ADMIN_KEY = tu nueva clave → Save (el servicio se reinicia solo) y volvé a conectar.'); return; }
      var d=await r.json();
      if(!d.ok){ setEstado('⚠ '+(d.error||'no autorizado')); return; }
      setEstado('Conectado ✔ · ' + new Date().toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit'}));
      var lista=$('lista'); lista.innerHTML=''; totalNoLeidos=0; SESMETA={};
      if(!d.sesiones||!d.sesiones.length){ lista.innerHTML='<div class="vacio">Aún no hay conversaciones.</div>'; return; }
      d.sesiones.forEach(function(s){
        SESMETA[s.sesion]=s;
        var div=document.createElement('div');
        div.className='sItem'+(SEL===s.sesion?' sel':'');
        var nombre=s.nombre||(s.tel?('WhatsApp '+s.tel):s.sesion.replace(/^web_/,''));
        var noleidos=parseInt(s.no_leidos||0,10)||0;
        totalNoLeidos+=noleidos;
        var top=document.createElement('div'); top.className='top';
        var nom=document.createElement('span'); nom.className='nom'; nom.textContent=nombre; top.appendChild(nom);
        var right=document.createElement('span');
        if(noleidos>0){ var b=document.createElement('span'); b.className='badge'; b.textContent=noleidos; right.appendChild(b); }
        if(s.alerta==='fallido'){ var w=document.createElement('span'); w.className='warn'; w.textContent='aviso falló'; right.appendChild(w); }
        var tg=document.createElement('span'); tg.className='tag '+((s.modo==='humano')?'humano':'bot'); tg.textContent=(s.modo==='humano'?'humano':'bot'); right.appendChild(tg);
        top.appendChild(right); div.appendChild(top);
        var sub=document.createElement('div'); sub.className='sub'; sub.textContent=(s.tel?('📱 '+s.tel+' · '):'')+(s.ultima?hhmm(s.ultima):''); div.appendChild(sub);
        div.addEventListener('click', function(){ seleccionar(s.sesion, nombre); });
        lista.appendChild(div);
      });
      document.title = (totalNoLeidos>0 ? '('+totalNoLeidos+') ' : '') + 'PG del Campo — Panel de Chat';
      if(SEL) pintarAlerta(SESMETA[SEL]);
    }catch(e){ setEstado('⚠ sin conexión'); mostrarBarra('No pude conectarme a <b>'+AGENT+'</b>. Revisá la URL (tiene que ser la del bot, terminada en onrender.com) y que el servicio esté despierto.'); }
  }

  function pintarAlerta(s){
    var el=$('chatAlerta');
    if(!s || !s.alerta){ el.style.display='none'; el.textContent=''; return; }
    if(s.alerta==='enviado'){ el.style.display='none'; el.textContent=''; return; }
    el.style.display='inline-block';
    el.textContent = (s.alerta==='fallido') ? '⚠ aviso al dueño NO salió' : ('aviso: '+s.alerta);
  }

  function seleccionar(sesion, nombre){
    SEL=sesion; lastTs=0;
    try{ localStorage.setItem('pg_panel_sel',sesion); }catch(e){}
    $('chatHead').style.display='flex';
    $('inputRow').style.display='flex';
    $('chatNom').textContent=nombre||sesion;
    document.body.classList.add('chatAbierto');
    $('msgs').innerHTML='';
    pintarAlerta(SESMETA[SEL]);
    cargarSesiones();
    cargarMensajes(true);
  }

  function pintar(m){
    var div=document.createElement('div');
    var rol=(m.rol==='cliente')?'cliente':(m.rol==='humano'?'humano':(m.rol==='nota'?'nota':'bot'));
    div.className='m '+rol;
    div.textContent=m.texto||'';
    if(rol!=='nota'){
      var meta=document.createElement('span'); meta.className='meta';
      meta.textContent=(rol==='cliente'?'Cliente':(rol==='humano'?'Vos':'Asistente'))+' · '+hhmm(m.ts);
      div.appendChild(meta);
    }
    $('msgs').appendChild(div);
  }

  async function cargarMensajes(reset){
    if(!SEL) return;
    try{
      var r=await fetch(api('/chat-messages')+'&sesion='+encodeURIComponent(SEL)+'&after='+(reset?0:lastTs));
      var d=await r.json();
      if(!d.ok) return;
      modoSel=d.modo||'bot';
      actualizarModoUI();
      if(reset) $('msgs').innerHTML='';
      var nuevosCliente=0;
      (d.mensajes||[]).forEach(function(m){ pintar(m); if(m.ts>lastTs) lastTs=m.ts; if(m.rol==='cliente') nuevosCliente++; });
      if(nuevosCliente>0 && !reset) beep();
      if(d.mensajes&&d.mensajes.length) $('msgs').scrollTop=$('msgs').scrollHeight;
    }catch(e){}
  }

  function actualizarModoUI(){
    var tag=$('chatModo'); tag.className='tag '+(modoSel==='humano'?'humano':'bot'); tag.textContent=modoSel;
    var btn=$('btnModo');
    if(modoSel==='humano'){ btn.textContent='Devolver al asistente'; btn.className='modoBtn soltar'; }
    else{ btn.textContent='Tomar conversación'; btn.className='modoBtn tomar'; }
  }

  async function cambiarModo(){
    if(!SEL) return;
    var nuevo=(modoSel==='humano')?'bot':'humano';
    try{
      await fetch(api('/chat-mode'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sesion:SEL,modo:nuevo})});
      modoSel=nuevo; actualizarModoUI(); cargarMensajes(false); cargarSesiones();
    }catch(e){}
  }

  async function enviar(){
    var t=$('txt').value.trim(); if(!t||!SEL) return;
    $('txt').value='';
    try{
      await fetch(api('/chat-reply'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sesion:SEL,texto:t})});
      modoSel='humano'; actualizarModoUI(); cargarMensajes(false);
    }catch(e){}
  }

  function beep(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      var ctx=new AC(); var o=ctx.createOscillator(); var g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type='sine';
      g.gain.setValueAtTime(0.08,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.35);
      o.start(); o.stop(ctx.currentTime+0.35);
    }catch(e){}
  }

  function conectar(){
    AGENT=normalizar($('inUrl').value)||DEF;
    $('inUrl').value=AGENT;
    KEY=$('inKey').value.trim();
    if(!KEY){ setEstado(''); mostrarBarra('Falta la clave. Escribí la <b>clave admin</b> que configuraste en Render (variable <b>ADMIN_KEY</b>). En este bot la clave de fábrica <b>pg-admin</b> ya no aplica.'); return; }
    try{ localStorage.setItem('pg_panel_url',AGENT); localStorage.setItem('pg_panel_key',KEY); }catch(e){}
    cargarSalud();
    cargarSesiones();
    if(tSes) clearInterval(tSes); tSes=setInterval(cargarSesiones,5000);
    if(tMsg) clearInterval(tMsg); tMsg=setInterval(function(){ cargarMensajes(false); },3000);
  }

  $('btnConn').addEventListener('click', conectar);
  $('btnEnviar').addEventListener('click', enviar);
  $('btnModo').addEventListener('click', cambiarModo);
  var bv=document.getElementById('btnVolver');
  if(bv) bv.addEventListener('click', function(){ document.body.classList.remove('chatAbierto'); SEL=null; cargarSesiones(); });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    cargarSalud(); cargarSesiones();
    if(SEL) cargarMensajes(true);
  });
  $('txt').addEventListener('keydown', function(e){ if(e.key==='Enter') enviar(); });

  // Arranque: clave y URL recordadas, o las que vengan en el enlace (?key=...)
  (function arranque(){
    var qs=new URLSearchParams(location.search);
    var k='', u='';
    try{ k=localStorage.getItem('pg_panel_key')||''; u=localStorage.getItem('pg_panel_url')||''; }catch(e){}
    if(qs.get('key')) k=qs.get('key');
    if(qs.get('url')) u=qs.get('url');
    /* Si quedó guardada la URL vieja (pg-del-campo-bot), la corregimos sola */
    if(u && /pg-del-campo-bot\.onrender\.com/i.test(u)) u=DEF;
    /* El panel NO vive en el servidor del bot: usamos siempre la URL real */
    if(!u) u=DEF;
    $('inUrl').value=normalizar(u);
    $('inKey').value=k||'';
    if(k) conectar();
    else { setEstado('Poné la clave y dale Conectar'); }
  })();
})();

/* ---------- App instalable: service worker ---------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
